name: Map browser visual checks
on:
  push:
    branches: [fix/map-unified-sidebar-detail]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npm run build
      - run: node scripts/test-map-browser.mjs
      - name: Upload browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-browser-screenshots
          path: diagnostics/map-*
          if-no-files-found: ignore
