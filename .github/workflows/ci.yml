name: MaxTrip checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  production-build-and-api-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Smoke-test the live SNCF API and target Paris/date queries
        run: node scripts/smoke-sncf-api.mjs
      - name: Build production app
        run: |
          mkdir -p diagnostics
          set +e
          npm run build > diagnostics/build.log 2>&1
          build_status=$?
          cat diagnostics/build.log
          echo "$build_status" > diagnostics/build-exit-code.txt
          exit "$build_status"
      - name: Smoke-test itinerary search against live SNCF data
        run: node scripts/smoke-itinerary-endpoint.mjs
      - name: Upload build and API diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maxtrip-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7
