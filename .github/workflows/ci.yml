name: MaxTrip checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  production-build-and-api-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Smoke-test the live SNCF API and target Paris/date queries
        run: node scripts/smoke-sncf-api.mjs
      - name: Publish probe output to the ci-diagnostics branch
        if: always()
        run: |
          if [ -f diagnostics/api-probe.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c ci-diagnostics
            git add diagnostics/api-probe.json
            git commit -m "ci: record latest SNCF API probe"
            git push --force origin HEAD:refs/heads/ci-diagnostics
          fi
      - name: Build production app
        run: npm run build
