name: MaxTrip checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  production-build-and-api-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Update Vaul lockfile on this feature branch
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/vaul-mobile-map-sheet'
        run: |
          git fetch origin feature/vaul-mobile-map-sheet
          git checkout -B feature/vaul-mobile-map-sheet origin/feature/vaul-mobile-map-sheet
          npm install --package-lock-only --ignore-scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock Vaul dependency tree"
            git push origin HEAD:feature/vaul-mobile-map-sheet
          fi
      - name: Smoke-test the live SNCF API and target Paris/date queries
        run: node scripts/smoke-sncf-api.mjs
      - name: Build production app
        run: |
          mkdir -p diagnostics
          set +e
          npm run build > diagnostics/build.log 2>&1
          build_status=$?
          cat diagnostics/build.log
          echo "$build_status" > diagnostics/build-exit-code.txt
          exit "$build_status"
      - name: Smoke-test itinerary search against live SNCF data
        run: node scripts/smoke-itinerary-endpoint.mjs
      - name: Upload build and API diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maxtrip-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Report failed build to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f diagnostics/build.log ]; then
            printf '### Build failure diagnostic\n\n```\n' > diagnostics/build-comment.md
            tail -n 55 diagnostics/build.log >> diagnostics/build-comment.md
            printf '\n```\n' >> diagnostics/build-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file diagnostics/build-comment.md
          fi
