name: MaxTrip checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  production-build-and-api-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Smoke-test the live SNCF API and ODSQL filters
        run: node scripts/smoke-sncf-api.mjs
      - name: Build production app
        run: npm run build
