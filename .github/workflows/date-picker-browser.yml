name: Date picker browser checks
on:
  push:
    branches: [feature/modern-date-picker]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dates:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npm run build
      - run: node scripts/test-date-picker-browser.mjs
